name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/loidolt/mealie-agent-mcp
  UV_VERSION: "0.9.22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mealie releases the tools are verified against.
        mealie: ["v3.0.2", "v3.30.0"]
    services:
      mealie:
        image: ghcr.io/mealie-recipes/mealie:${{ matrix.mealie }}
        ports: ["9925:9000"]
        env:
          ALLOW_SIGNUP: "false"
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/api/app/about')\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Create Mealie user and API token
        run: uv run python dev/bootstrap_mealie.py --url http://localhost:9925 --github-env
      - name: Integration tests
        run: uv run pytest -m integration -v
        env:
          MEALIE_IT_SCRAPE_URL: https://www.bbcgoodfood.com/recipes/easy-pancakes
      - name: Container smoke test (bearer auth over streamable HTTP)
        run: |
          docker build -t mealie-agent-mcp:ci .
          token=$(openssl rand -hex 32)
          docker run -d --name mcp --network host \
            -e MEALIE_URL=http://localhost:9925 -e MEALIE_API_TOKEN \
            -e MEALIE_MCP_AUTH_MODE=bearer -e MEALIE_MCP_BEARER_TOKENS="$token" \
            mealie-agent-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp -d '{}')
          test "$code" = 401
          uv run python dev/smoke_http.py http://localhost:8000/mcp "$token"
      - if: failure()
        run: docker logs mcp || true

  image:
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Release tags v1.2.3 -> 1.2.3, 1.2, 1 and latest (latest only for
          # non-prerelease versions). Nothing is pushed for branches or PRs.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
